
<style>

    object-position: center top;
    transition: opacity 1.8s ease;

  .back {
    opacity: 0;
    z-index: 2;

  .image-wrapper:hover .front {
    opacity: 0;
  }

  .image-wrapper:hover .back {
    opacity: 1;
  }

  .button-overlay {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
  }

  /* ✅ Slightly larger button text */
  .button {
    padding: 10px 16px;
    background-color: #1f91d1;
    color: #ffffff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 1.05rem;
  }

  .text-block {
    padding-top: 12px;
    text-align: left;
  }

    margin-bottom: 6px;
  }

    }

    .section-heading {
      max-width: 500px;
    }
  }
