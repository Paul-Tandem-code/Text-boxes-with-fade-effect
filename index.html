
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scroll Fade Banner</title>

<style>
  body {
    margin: 0;
  }

  .spacer {
    height: 1400px;
  }

  .banner {
    position: sticky;
    top: 0;
    height: 980px;
    overflow: hidden;
  }

  .image {
    position: absolute;
    width: 100%;
    height: 980px;
    object-fit: cover;
    object-position: top center;
    transition: opacity 0.3s linear;
  }

  .image1 {
    z-index: 1;
  }

  .image2 {
    opacity: 0;
    z-index: 2;
  }

  .overlay {
    position: absolute;
    top: 55%;
    left: 25%;
    transform: translateY(-50%);
    width: 40%;
    opacity: 0;
    z-index: 3;
    transition: opacity 0.3s linear, transform 0.3s ease;
  }

  .overlay img {
    width: 100%;
    display: block;
  }

  @media (max-width: 768px) {
    .overlay {
      width: 75%;
      left: 12.5%;
    }
  }

  @media (max-width: 480px) {
    .overlay {
      width: 90%;
      left: 5%;
    }
  }
</style>
</head>

<body>

<section class="banner">

  <!-- Primary image with full alt -->
  <img 
    src="https://tandemcarers.org.au/images/2026%20Election/20260527%20FN%20family%20blur%20full%20width.png"
    alt="Blurred image of a family with one man in full focus. As you scroll down the page, the image fades to a clear image with all people in focus. A banner appears and says 'put all mental health carers in the picture’"
    class="image image1"
  >

  <!-- Decorative second image -->
  <img 
    src="https://tandemcarers.org.au/images/2026%20Election/20260527%20FN%20family%20unblur%20full%20width.png"
    alt=""
    aria-hidden="true"
    class="image image2"
    id="img2"
  >

  <!-- Decorative overlay -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <img src="https://tandemcarers.org.au/images/2026%20Election/260527%20In%20the%20picture%20text%20grey%20background.png" alt="">
  </div>

  <!-- No-JS fallback -->
  <noscript>
    <img 
      src="https://tandemcarers.org.au/images/2026%20Election/20260527%20FN%20family%20unblur%20full%20width.png"
      alt="Blurred image of a family with one man in full focus. As you scroll down the page, the image fades to a clear image with all people in focus. A banner appears and says 'put all mental health carers in the picture’"
      style="width:100%; height:980px; object-fit:cover;"
    >
  </noscript>

</section>

<div class="spacer"></div>

<script>
window.addEventListener("scroll", function () {
  const img2 = document.getElementById("img2");
  const overlay = document.getElementById("overlay");

  const scrollY = window.scrollY;
  const fadeDistance = 1200;
  let progress = scrollY / fadeDistance;

  let raw = Math.min(Math.max((progress - 0.35) / 0.65, 0), 1);

  let eased = raw < 0.5
    ? 2 * raw * raw
    : 1 - Math.pow(-2 * raw + 2, 2) / 2;

  img2.style.opacity = eased;
  overlay.style.opacity = eased;

  overlay.style.transform = `translateY(${ -50 + (eased * -5) }%)`;
});
</script>

</body>
</html>
